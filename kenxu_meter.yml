- name: Opt-in Kenxu Xray user metering
  hosts: all
  become: true
  vars:
    kenxu_meter_inbound_port: 443
    kenxu_meter_api_port: 10085
    kenxu_meter_bootstrap: false
    kenxu_meter_xray_service: xray
    kenxu_meter_xray_config: /usr/local/etc/xray/config.json
    kenxu_meter_activity_enabled: true
  tasks:
    - name: Require explicit meter registration and private transport endpoint
      ansible.builtin.assert:
        that:
          - kenxu_meter_node_id is defined
          - kenxu_meter_token is defined
          - kenxu_meter_token | length >= 30
          - kenxu_meter_origin is defined
          - kenxu_meter_origin is match('^https://[^/]+$') or kenxu_meter_origin is match('^http://127\\.0\\.0\\.1:[0-9]+$')
      no_log: true

    - name: Locate an existing collector before exclusive bootstrap maintenance
      ansible.builtin.stat:
        path: /usr/local/lib/kenxu-meter/kenxu_meter.py
      register: kenxu_existing_collector

    - name: Check that metadata infrastructure is already enabled for a hot update
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import json,sys; c=json.load(open(sys.argv[1])); sys.exit(0 if c.get('policy',{}).get('levels',{}).get('88',{}).get('statsUserOnline') and c.get('log',{}).get('access')=='/var/log/kenxu/access.log' else 1)"
          - "{{ kenxu_meter_xray_config }}"
      register: kenxu_activity_ready
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - kenxu_meter_activity_enabled | bool
        - not (kenxu_meter_bootstrap | bool)

    - name: Require explicit bootstrap when enabling activity metadata
      ansible.builtin.assert:
        that: kenxu_activity_ready.rc == 0
        fail_msg: Enable metadata with kenxu_meter_bootstrap=true, one server at a time; do not silently update core logging through a hot user sync.
      when:
        - kenxu_meter_activity_enabled | bool
        - not (kenxu_meter_bootstrap | bool)

    - name: Drain old process counters before replacing the collector or restarting Xray
      when:
        - kenxu_meter_bootstrap | bool
        - kenxu_existing_collector.stat.exists
      block:
        - name: Stop the old collector
          ansible.builtin.systemd:
            name: kenxu-meter
            state: stopped
        - name: Flush the final counters using the old installed code
          ansible.builtin.command:
            argv: [/usr/bin/python3, /usr/local/lib/kenxu-meter/kenxu_meter.py, --once]
          changed_when: true
          no_log: true
      rescue:
        - name: Resume old collection after a failed drain
          ansible.builtin.systemd:
            name: kenxu-meter
            state: started
        - name: Refuse to restart the core with undrained counters
          ansible.builtin.fail:
            msg: Final counter drain failed; old collection resumed. Repair the portal/queue before upgrading.
      always:
        - name: Keep collection running while staging files and packages
          ansible.builtin.systemd:
            name: kenxu-meter
            state: started

    - name: Ensure the activity log rotation utility is installed
      ansible.builtin.package:
        name: logrotate
        state: present
      when: kenxu_meter_activity_enabled | bool

    - name: Create private meter directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /var/lib/kenxu-meter
        - /etc/kenxu-meter
        - /usr/local/lib/kenxu-meter

    - name: Install collector
      ansible.builtin.copy:
        src: files/kenxu_meter.py
        dest: /usr/local/lib/kenxu-meter/kenxu_meter.py
        owner: root
        group: root
        mode: '0700'

    - name: Install bounded activity parser
      ansible.builtin.copy:
        src: files/kenxu_activity.py
        dest: /usr/local/lib/kenxu-meter/kenxu_activity.py
        owner: root
        group: root
        mode: '0600'

    - name: Install optional per-flow transport without enabling it
      ansible.builtin.copy:
        src: files/kenxu_flow.py
        dest: /usr/local/lib/kenxu-meter/kenxu_flow.py
        owner: root
        group: root
        mode: '0600'

    - name: Inspect existing optional registration fields
      ansible.builtin.stat:
        path: /etc/kenxu-meter/config.json
      register: kenxu_registration_stat

    - name: Read existing registration privately
      ansible.builtin.slurp:
        src: /etc/kenxu-meter/config.json
      register: kenxu_registration_previous
      when: kenxu_registration_stat.stat.exists
      no_log: true

    - name: Preserve optional flow settings during ordinary meter maintenance
      ansible.builtin.set_fact:
        kenxu_registration_extra: "{{ (kenxu_registration_previous.content | b64decode | from_json) if kenxu_registration_stat.stat.exists else {} }}"
      no_log: true

    - name: Create private Xray activity log directory
      ansible.builtin.file:
        path: /var/log/kenxu
        state: directory
        owner: xray
        group: xray
        mode: '0700'
      when: kenxu_meter_activity_enabled | bool

    - name: Install thirty-day bounded activity log rotation
      ansible.builtin.copy:
        src: files/kenxu-activity.logrotate
        dest: /etc/logrotate.d/kenxu-activity
        owner: root
        group: root
        mode: '0644'
      when: kenxu_meter_activity_enabled | bool

    - name: Write private registration without exposing the token
      ansible.builtin.copy:
        content: "{{ kenxu_registration_extra | combine({'portal_origin': kenxu_meter_origin, 'node_id': kenxu_meter_node_id, 'token': kenxu_meter_token, 'inbound_port': kenxu_meter_inbound_port | int, 'api_port': kenxu_meter_api_port | int, 'xray_service': kenxu_meter_xray_service, 'xray_config': kenxu_meter_xray_config, 'activity_enabled': kenxu_meter_activity_enabled | bool, 'access_log': '/var/log/kenxu/access.log'}) | to_nice_json }}"
        dest: /etc/kenxu-meter/config.json
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Install service
      ansible.builtin.template:
        src: templates/kenxu-meter.service.j2
        dest: /etc/systemd/system/kenxu-meter.service
        owner: root
        group: root
        mode: '0644'

    - name: Stop the collector before exclusive bootstrap maintenance
      ansible.builtin.systemd:
        name: kenxu-meter
        state: stopped
        daemon_reload: true
      when: kenxu_meter_bootstrap | bool

    - name: Bootstrap only when explicitly requested and always resume collection
      when: kenxu_meter_bootstrap | bool
      block:
        - name: Validate and apply infrastructure with a recoverable core backup
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - /usr/local/lib/kenxu-meter/kenxu_meter.py
              - --bootstrap
          changed_when: true
          no_log: true
      always:
        - name: Resume collection after bootstrap success or restored-core failure
          ansible.builtin.systemd:
            name: kenxu-meter
            enabled: true
            state: started
            daemon_reload: true

    - name: Start persistent collection
      ansible.builtin.systemd:
        name: kenxu-meter
        enabled: true
        state: restarted
        daemon_reload: true
